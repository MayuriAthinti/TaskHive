<div class="app-layout">
  @if (showSidebar()) {
    <aside class="sidebar" [class.collapsed]="isCollapsed()">
      <div class="logo">
        @if (!isCollapsed()) {
          <h1> TaskHive</h1>
        }
        <button class="collapse-btn" (click)="toggleSidebar()">
          {{ isCollapsed() ? '→' : '←' }}
        </button>
      </div>

      <nav>
        <button class="nav-item" routerLink="/dashboard" routerLinkActive="active">
          <span>▦</span>
          @if (!isCollapsed()) { Dashboard }
        </button>

        <button class="nav-item" routerLink="/projects" routerLinkActive="active">
          <span>▣</span>
          @if (!isCollapsed()) { Projects }
        </button>

        <button class="nav-item" routerLink="/tasks" routerLinkActive="active">
          <span>✓</span>
          @if (!isCollapsed()) { Tasks }
        </button>
      </nav>

    </aside>
  }

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
